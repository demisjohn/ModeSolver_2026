[project]
name = "ModeSolver-2026"
version = "0.1.0"
description = "pyFIMM-style 2D cross-section builder with EMpy finite-difference mode solving"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "ElectromagneticPython>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ModeSolver_2026*"]
